# Semantic versioning (https://semver.org) driven by Conventional Commits
# (https://www.conventionalcommits.org). Written in plain bash: no third-party release tool.
#
# How the next version is chosen, from the commits since the last stable tag (vX.Y.Z):
#   feat!: / fix!: ... or "BREAKING CHANGE:" in the body  -> MAJOR  (1.4.2 -> 2.0.0)
#   feat:                                                  -> MINOR  (1.4.2 -> 1.5.0)
#   fix: perf: revert: refactor: build:                    -> PATCH  (1.4.2 -> 1.4.3)
#   docs: chore: ci: test: style: (or no prefix)           -> no release
# The very first release is 1.0.0.
#
# Branches:
#   main / master -> stable release      v1.5.0
#   stag          -> release candidate   v1.5.0-rc.1, v1.5.0-rc.2, ... (marked as pre-release)
# "Run workflow" (manual) can force a patch / minor / major bump on any branch.
#
# The job creates the annotated git tag and then calls deploy.yml, which builds and publishes the APK.
name: Semantic versioning

on:
  push:
    branches: [main, master, stag]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump ('auto' reads the Conventional Commits)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write

# Never compute two versions at the same time on the same branch.
concurrency:
  group: versioning-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Compute version and tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.next.outputs.release }}
      version: ${{ steps.next.outputs.version }}
      prerelease: ${{ steps.next.outputs.prerelease }}
      notes: ${{ steps.next.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags are needed to find the last version

      - name: Compute the next semantic version
        id: next
        env:
          BRANCH: ${{ github.ref_name }}
          BUMP_INPUT: ${{ inputs.bump || 'auto' }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet

          # ---- Release channel ------------------------------------------------------------
          case "$BRANCH" in
            main|master) channel=stable ;;
            *)           channel=rc ;;
          esac

          # ---- Last stable version ----------------------------------------------------------
          last_stable=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          if [ -n "$last_stable" ]; then range="$last_stable..HEAD"; else range="HEAD"; fi
          echo "Last stable tag: ${last_stable:-<none>}  (channel: $channel, range: $range)"

          # ---- Read the commits -------------------------------------------------------------
          rank() { case "$1" in major) echo 3 ;; minor) echo 2 ;; patch) echo 1 ;; *) echo 0 ;; esac; }
          bump=none
          breaking="" features="" fixes="" performance="" other=""
          while IFS= read -r -d $'\x1e' entry; do
            entry=${entry#$'\n'}
            [ -z "$entry" ] && continue
            hash=${entry%%$'\x1f'*}; rest=${entry#*$'\x1f'}
            subject=${rest%%$'\x1f'*}; body=${rest#*$'\x1f'}
            level=none
            if [[ "$subject" =~ ^([a-zA-Z]+)(\(([^\)]*)\))?(!)?:[[:space:]]+(.+)$ ]]; then
              type=${BASH_REMATCH[1],,}; scope=${BASH_REMATCH[3]}; bang=${BASH_REMATCH[4]}; text=${BASH_REMATCH[5]}
            else
              type=other; scope=""; bang=""; text=$subject
            fi
            line="- ${scope:+**$scope:** }$text ($hash)"
            if [ -n "$bang" ] || grep -qE '^BREAKING[ -]CHANGE:' <<<"$body"; then
              level="major"; breaking+="$line"$'\n'
            fi
            case "$type" in
              feat) [ "$level" = major ] || level="minor"; features+="$line"$'\n' ;;
              fix|revert) [ "$level" = major ] || level="patch"; fixes+="$line"$'\n' ;;
              perf) [ "$level" = major ] || level="patch"; performance+="$line"$'\n' ;;
              refactor|build) [ "$level" = major ] || level="patch"; other+="- $subject ($hash)"$'\n' ;;
              *) other+="- $subject ($hash)"$'\n' ;;
            esac
            if [ "$(rank "$level")" -gt "$(rank "$bump")" ]; then bump=$level; fi
          done < <(git log --no-merges --format='%h%x1f%s%x1f%b%x1e' "$range")

          if [ "$BUMP_INPUT" != auto ]; then
            echo "Manual bump requested: $BUMP_INPUT"
            bump=$BUMP_INPUT
          fi
          echo "Bump from commits: $bump"

          no_release() { echo "No release: $1"; echo "release=false" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$bump" = none ] && no_release "only docs/chore/ci/test/style commits since ${last_stable:-the beginning}"

          # A release candidate is only cut when something releasable arrived since the last tag
          # of any kind on this branch (so a docs-only push to stag does not make a new rc).
          if [ "$channel" = rc ] && [ "$BUMP_INPUT" = auto ]; then
            last_any=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
            if [ -n "$last_any" ] && [ "$last_any" != "$last_stable" ]; then
              fresh=$(git log --no-merges --format=%s "$last_any..HEAD" | grep -cE '^(feat|fix|perf|revert|refactor|build)(\(.*\))?!?:' || true)
              [ "$fresh" -eq 0 ] && no_release "nothing releasable since $last_any"
            fi
          fi

          # ---- Next version -----------------------------------------------------------------
          if [ -z "$last_stable" ]; then
            next=1.0.0
          else
            IFS=. read -r major minor patch <<<"${last_stable#v}"
            case "$bump" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="$major.$((minor + 1)).0" ;;
              patch) next="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          if [ "$channel" = rc ]; then
            n=$(git tag --list "v$next-rc.*" | wc -l)
            version="$next-rc.$((n + 1))"; prerelease=true
          else
            version=$next; prerelease=false
          fi
          git rev-parse -q --verify "refs/tags/v$version" >/dev/null && no_release "tag v$version already exists"
          echo "Next version: $version"

          # ---- Release notes ----------------------------------------------------------------
          notes=$(
            echo "## Mili Games v$version"
            [ "$prerelease" = true ] && echo && echo "> Test build (release candidate) from the \`$BRANCH\` branch."
            section() { [ -n "$2" ] && printf '\n### %s\n%s' "$1" "$2"; return 0; }
            section "⚠️ Breaking changes" "$breaking"
            section "✨ New features" "$features"
            section "🐛 Fixes" "$fixes"
            section "⚡ Performance" "$performance"
            section "🔧 Other changes" "$other"
            echo
            if [ -n "$last_stable" ]; then
              echo "**Full changelog:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$last_stable...v$version"
            fi
          )
          {
            echo "release=true"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "notes<<RELEASE_NOTES_EOF"
            echo "$notes"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
          { echo "### Next version: \`v$version\`"; echo; echo "$notes"; } >> "$GITHUB_STEP_SUMMARY"

      # Checked before tagging, so a missing key leaves no orphan tag: add the secrets and re-run.
      - name: Require the release key for stable versions
        if: steps.next.outputs.release == 'true' && steps.next.outputs.prerelease != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.MEGAGAMES_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Stable versions must be signed with the release key, but the signing secrets are not set. Run the Signing key workflow: docs/en/google-play.md#1-signing-key"
            exit 1
          fi

      - name: Create and push the tag
        if: steps.next.outputs.release == 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Mili Games v$VERSION"
          git push origin "v$VERSION"

  deploy:
    name: Build and publish the APK
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.version.outputs.version }}
      prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
      notes: ${{ needs.version.outputs.notes }}
      ref: v${{ needs.version.outputs.version }}
    secrets: inherit
