# Builds, tests and lints every push and pull request, and publishes the APKs as artifacts
# together with their SHA-256 checksums so anyone can verify what CI produced.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Makes sure gradle-wrapper.jar is the official one published by Gradle.
      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, UI tests (Robolectric) and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      # The app should stay far lighter than the usual card and puzzle apps (20-60 MB): every
      # picture is drawn in code. A warning shows up past 10 MB and the build fails past 20 MB,
      # time to think about compressing assets before it reaches phones with little space.
      - name: APK size budget
        run: |
          warn=$((10 * 1024 * 1024)); limit=$((20 * 1024 * 1024))
          echo "| APK | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          status=0
          for apk in app/build/outputs/apk/release/*.apk; do
            size=$(stat -c %s "$apk")
            echo "| $(basename "$apk") | $((size / 1024)) KB |" >> "$GITHUB_STEP_SUMMARY"
            echo "$(basename "$apk"): $((size / 1024)) KB"
            if [ "$size" -gt "$limit" ]; then
              echo "::error file=$apk::The release APK is $((size / 1024)) KB, over the 20 MB budget."
              status=1
            elif [ "$size" -gt "$warn" ]; then
              echo "::warning file=$apk::The release APK is $((size / 1024)) KB, over the 10 MB warning line."
            fi
          done
          exit $status

      - name: Checksums
        run: |
          cd app/build/outputs/apk
          sha256sum debug/*.apk release/*.apk | tee SHA256SUMS.txt
          ls -la debug release

      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
