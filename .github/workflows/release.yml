# Publishes a GitHub Release when a tag like v1.2.3 is pushed.
# The APK is signed with the project's release key, stored as repository secrets:
#   MEGAGAMES_KEYSTORE_BASE64   base64 of the .jks file
#   MEGAGAMES_KEYSTORE_PASSWORD
#   MEGAGAMES_KEY_ALIAS
#   MEGAGAMES_KEY_PASSWORD
# See docs/en/building.md for how to create them.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MEGAGAMES_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Signing secrets are missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MEGAGAMES_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build the signed release
        env:
          MEGAGAMES_KEYSTORE_PASSWORD: ${{ secrets.MEGAGAMES_KEYSTORE_PASSWORD }}
          MEGAGAMES_KEY_ALIAS: ${{ secrets.MEGAGAMES_KEY_ALIAS }}
          MEGAGAMES_KEY_PASSWORD: ${{ secrets.MEGAGAMES_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease

      - name: Rename and checksum
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/MegaGames-${GITHUB_REF_NAME}.apk"
          cd dist && sha256sum *.apk | tee SHA256SUMS.txt

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Mega Games $GITHUB_REF_NAME" --generate-notes
